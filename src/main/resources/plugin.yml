name: ChunkClaim
version: '1.0.0'
main: de.chunkclaim.ChunkClaimPlugin
api-version: '26.1'
description: Chunks claimen mit Dias, Schutz und Zugriffsrechte pro Chunk
commands:
  chunk:
    description: Chunks claimen und verwalten
    usage: /chunk help
    aliases: [chunks]
permissions:
  chunkclaim.use:
    description: Chunks claimen und verwalten
    default: true
  chunkclaim.admin:
    description: Alle Chunks ändern und löschen, Schutz umgehen
    default: op
